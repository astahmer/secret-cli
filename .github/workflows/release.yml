name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: show toolchain
        run: |
          sw_vers
          swift --version
          uname -m

      - name: build + package
        run: ./scripts/package.sh --universal --formula

      - name: smoke test the packaged binary
        run: |
          STAGE=$(mktemp -d)
          tar -xzf build/dist/secret-*-universal.tar.gz -C "$STAGE"
          "$STAGE"/secret-*/secret version
          "$STAGE"/secret-*/secret --help >/dev/null
          "$STAGE"/secret-*/secret audit --json >/dev/null || true
          echo "packaged binary runs"

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/secret-*.tar.gz
            build/dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Install

            Homebrew (recommended):

            ```sh
            brew install astahmer/tap/secret
            ```

            Or download `secret-<version>-universal.tar.gz` below, unpack it and
            put `secret` on your `PATH`:

            ```sh
            tar -xzf secret-*-universal.tar.gz
            sudo install -m 755 secret-*/secret /usr/local/bin/secret
            ```

            Verify with `shasum -a 256 -c SHA256SUMS`.

            The `bw` CLI (Bitwarden) or the macOS Keychain backend is still
            required for value storage; see the README.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish formula to the tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set — skipping tap update."
            echo "Copy build/dist/secret.rb into the tap and set the token to automate it."
            exit 0
          fi
          curl -sSfL -o /tmp/secret.rb "https://raw.githubusercontent.com/astahmer/homebrew-tap/main/Formula/secret.rb" || true
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/astahmer/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp build/dist/secret.rb /tmp/tap/Formula/secret.rb
          cd /tmp/tap
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "secret ${GITHUB_REF_NAME}" || echo "formula unchanged"
          git push origin HEAD:main
