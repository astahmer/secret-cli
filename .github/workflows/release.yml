name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: show toolchain
        run: |
          sw_vers
          swift --version
          uname -m

      - name: build + package
        env:
          SECRET_EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          expected=$(printf '%s' "$SECRET_EXPECTED_VERSION" | sed 's/^v//')
          SECRET_EXPECTED_VERSION="$expected" ./scripts/package.sh --universal --formula

      - name: smoke test the packaged binary
        run: |
          STAGE=$(mktemp -d)
          tar -xzf build/dist/secret-*-universal.tar.gz -C "$STAGE"
          "$STAGE"/secret-*/secret version
          "$STAGE"/secret-*/secret --help >/dev/null
          "$STAGE"/secret-*/secret audit --json >/dev/null || true
          echo "packaged binary runs"

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/secret-*.tar.gz
            build/dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Install

            Homebrew (recommended):

            ```sh
            brew install astahmer/tap/secret
            ```

            Or download `secret-<version>-universal.tar.gz` below, unpack it and
            put `secret` on your `PATH`:

            ```sh
            tar -xzf secret-*-universal.tar.gz
            sudo install -m 755 secret-*/secret /usr/local/bin/secret
            ```

            Verify with `shasum -a 256 -c SHA256SUMS`.

            The `bw` CLI (Bitwarden) or the macOS Keychain backend is still
            required for value storage; see the README.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish formula to the tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set — skipping tap update."
            echo "Add a write deploy key for astahmer/homebrew-tap as that secret to automate it."
            exit 0
          fi
          # A write-scoped deploy key can push only to its own repository, so a
          # leak of this secret cannot reach anything else. It replaces the
          # personal token the workflow used before.
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy
          chmod 600 ~/.ssh/tap_deploy
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_deploy -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:astahmer/homebrew-tap.git /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp build/dist/secret.rb /tmp/tap/Formula/secret.rb
          cd /tmp/tap
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "secret ${GITHUB_REF_NAME}" || echo "formula unchanged"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_deploy -o IdentitiesOnly=yes" git push origin HEAD:main
          rm -f ~/.ssh/tap_deploy
